services:
  db:
    image: postgres:16-alpine
    container_name: pharmago-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmago_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test1234
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmago_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pharmago-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pharmago_db
      DB_USER: postgres
      DB_PASSWORD: test1234
      JWT_SECRET: pharmago_docker_secret_change_me
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: pharmago-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads: